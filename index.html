<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 보안: 인라인 스크립트 금지, 같은 출처 스크립트만 허용, 외부 리소스는 웹폰트 CSS 1개(버전 고정·SRI)만 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안내 가이드</title>
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="안내 가이드">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" integrity="sha384-SN6A48CJQjx946+DRb8wsoifC4a8ur9ZS6R+HCTgnBHOKCa6GLXAR3Qn8d1jztxg" crossorigin="anonymous">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" hidden>
  <div class="hd">
    <div class="t">
      <div class="k" id="brand"></div>
      <h1 id="title"></h1>
      <div class="s"><span id="subtitle"></span> <span id="totalTxt"></span>단계 · 화면을 좌우로 밀어 이동<span class="kb"> · ← → 키</span></div>
    </div>
    <div class="tools">
      <button class="chip on" id="bDim" type="button">강조 영역만 밝게</button>
      <button class="chip" id="bZoom" type="button">강조 확대</button>
      <button class="chip" id="bPlay" type="button"><span id="playLbl">자동재생</span><svg class="ring" id="ring" aria-hidden="true"><path id="ringPath" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="0"/></svg></button>
    </div>
  </div>

  <div class="stage">
    <div class="phone" id="phone">
      <div class="pz" id="pz">
        <div class="zoom" id="zoom">
          <img class="shot" id="shot" alt="" decoding="async" draggable="false">
          <div class="veil"></div>
          <div id="layers"></div>
        </div>
      </div>
      <button class="zreset" id="bZReset" type="button" aria-label="원래 크기로"><span id="zTxt">2.0×</span> · 원래 크기</button>
    </div>

    <div class="bottom">
      <div class="cap">
        <div class="row"><span class="no">STEP <span id="stepNo">1</span></span><span class="ph" id="phase"></span></div>
        <div class="tx" id="caption"></div>
        <div class="nt" id="note"></div>
      </div>
      <div class="prog"><i id="prog"></i></div>
      <div class="nav">
        <button class="btn" id="bPrev" type="button">← 이전</button>
        <div class="cnt"><span id="cnt">1</span> / <span id="cntTotal"></span></div>
        <button class="btn pri" id="bNext" type="button">다음 →</button>
      </div>
    </div>
  </div>
</div>

<aside id="rail" aria-label="진행 순서">
  <div class="rh"><div class="rt">진행 순서</div><button class="x" id="bClose" type="button">닫기 ✕</button></div>
  <div id="groups"></div>
  <div class="ft" id="notice"></div>
</aside>
<div id="backdrop"></div>
<button id="tab" type="button">진행 순서 ▶</button>

<div id="cover" class="hide" role="dialog" aria-label="안내 가이드 시작">
  <div class="logo"><svg viewBox="0 0 120 120" aria-hidden="true"><rect x="42" y="24" width="36" height="72" rx="7" fill="#0e1116"/><rect x="46" y="30" width="28" height="52" rx="3" fill="#e8ecf2"/><rect x="48" y="66" width="24" height="10" rx="3" fill="none" stroke="#ff3b30" stroke-width="3"/></svg></div>
  <div class="k" id="coverBrand"></div>
  <h2 id="coverHeading"></h2>
  <p id="coverBody"></p>
  <div class="meta"><span>총 <b id="coverTotal"></b>단계</span><span id="coverDuration"></span><span>좌우로 밀어 이동</span><span>두 손가락으로 확대</span></div>
  <button class="go" id="bStart" type="button">시작하기</button>
  <div class="hint" id="coverHint"></div>
</div>

<div id="end" role="dialog" aria-modal="true" aria-label="안내 종료">
  <div class="card">
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h3 id="endHeading"></h3>
    <p id="endBody"></p>
    <div class="acts">
      <button class="btn pri" id="bRestart" type="button">처음부터 다시 보기</button>
      <button class="btn" id="bExit" type="button">끝내기</button>
    </div>
    <div class="fb">이 화면은 브라우저가 직접 닫을 수 없습니다. 브라우저의 닫기(✕) 버튼으로 종료해 주세요.</div>
  </div>
</div>

<div id="loadErr" hidden><div class="card"><h3>가이드를 불러오지 못했습니다</h3><p id="loadErrMsg"></p></div></div>

<script src="app.js"></script>
</body>
</html>
